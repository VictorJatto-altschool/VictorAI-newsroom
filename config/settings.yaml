# Operator-owned settings. Every value here is enforced in code, never by the model.

automation:
  mode: approval            # manual | approval | restricted_autonomous
  paused: false
  timezone: Africa/Lagos

overnight_rule:
  window_start: "23:00"      # local time, autonomous posting allowed inside this window only
  window_end: "07:00"
  night_cap: 2               # max autonomous posts per window
  min_tier1_sources: 1
  min_other_sources: 2
  allowed_categories: [ai_models, ai_tools, research, space, product_launch, robotics]
  blocked_keywords: [lawsuit, sues, layoff, layoffs, fired, breach, hack, hacked, exploit, allegation, alleged, rumor, rumour, leak, leaked, election, senate, congress, president, minister, parliament, war, strike]

limits:
  max_posts_per_day: 12
  max_posts_per_hour: 1
  min_gap_minutes: 90           # 12 a day across 24 hours = one every two hours, give or take
  story_cooldown_days: 7
  entity_cooldown_days: 3
  max_drafts_per_run: 6        # highest-scoring first; the bar below keeps the feed to strong stories
  prime_hours: {start: "13:00", end: "01:00"}   # when Premium users in the US and Europe are online (local time)
  off_hours_max_posts: 3       # at most this many of the day's posts outside prime hours
  approval_ttl_minutes: 120    # an approval not handed off within this long expires: the next slot goes to what is trending now
  apply_to_manual: true        # Approve past the cap queues the post; it is handed to you at the next free slot

scoring:
  weights:
    source_count: 25
    velocity: 20
    tier1_present: 25
    novelty: 15
    category_weight: 15
  official_fresh_hours: 24     # an official announcement counts as postable on its own for this long
  thresholds:
    breaking: 85
    hot: 70
    trending: 50
    developing: 38
  category_weights:            # 0-1, how much the audience cares
    ai_models: 1.0
    ai_tools: 0.9
    research: 0.5                # papers need press pickup before they are news
    product_launch: 0.8
    space: 0.7
    science: 0.5
    cybersecurity: 0.6
    tech: 0.6
    leaders: 0.9                 # what founders and CEOs did or said today
    robotics: 0.85               # humanoids, industrial robots, lab demos
    business: 0.6
    other: 0.3

content_mix:                   # advisory shares, used for tie-breaking only
  ai_models: 35
  ai_tools: 30
  tech: 15
  space: 10
  analysis: 10

collect:
  workers: 8                   # feeds fetched at the same time; the watch list takes about as long as its slowest feed
  source_timeout_seconds: 15   # hard total budget per source (connect + reads); over it, the source counts as failed
  due_grace_minutes: 5         # a source is due this many minutes early, so cron runs 25-35 min apart never skip a 30-min feed
  gnews_resolve_per_cycle: 20  # Google News wrapper links resolved to the publisher's real address per cycle (2 requests each);
                               # Google blocks an address that asks too often, and a blocked batch pauses resolution for 90 min

filter:
  max_age_hours: 36
  languages: [en]
  drop_keywords: [sponsored, advertorial, giveaway, coupon, "promo code", horoscope]
  require_any_keywords: []     # empty = rely on source category
  min_title_chars: 12          # video titles are short ("Introducing GPT-6")

drafting:
  min_score: 60                # only stories this strong are drafted: official or widely corroborated, fresh, in-niche
  max_chars: 600               # account is X Premium (long posts allowed); 600 keeps posts scannable
  provider_order: [anthropic, gemini, groq, cerebras, mistral, openrouter, compat, mock]   # every configured key is used, in this order, with automatic failover

publishing:
  mode: intent                 # intent = free: Approve sends an "Open in X" button to your phone. api = X API pay-per-use.
  enabled: true
  x_username: SI4blog_
  # X API pay-per-use (docs.x.com, Oct 2026): post $0.015, post containing a URL $0.200, quote via id $0.015.
  link_in_post: false          # reach first: the post stands alone, the source link goes in the first reply
  require_take: true           # Approve first asks for one line of your own take; it goes into the post (X Original Content rules)
  upload_public_domain_video: false  # re-uploading footage, even public domain, reads as aggregation; link or quote instead
  render_when_link_preview: false  # false = skip the rendered card when the link already brings a picture (real media still wins)
  api_reply: plain             # plain = "Source: <publisher>" with no URL ($0.015) | link = full URL ($0.200) | none
  daily_budget_usd: 0.25       # API mode refuses to post once today's estimated spend reaches this
  cost_post_usd: 0.015
  cost_post_with_url_usd: 0.200

growth:                        # X program targets; keep in sync with X's current official rules
  follower_target: 500
  impressions_target_90d: 500000
  sync_daily: true             # API mode only: read your own follower count once a day (User: Read, $0.01)

educational:
  enabled: true
  max_per_day: 1               # educational posts drafted from operator notes only

digest:
  weekday: 0                   # Monday
  hour: 8                      # local time

telegram:
  card_ttl_minutes: 30         # a pending card nobody acted on in this long is deleted from the chat (0 = keep forever)

reminders:
  enabled: true
  slot: true                   # when a slot opens and nothing is waiting, send the strongest fresh story unasked
  slot_every_minutes: 60
  replies_at: "13:00"          # daily nudge for the reply habit (local time)
  growth_weekday: 0            # Monday
  growth_at: "09:00"

dashboard:
  enabled: true                # writes docs/index.html after each run (serve with GitHub Pages, free)
  show_drafts: false           # the repo is public; keep draft text out of the page unless you want it there
