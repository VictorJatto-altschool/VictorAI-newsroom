[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "victor-newsroom"
version = "0.1.0"
description = "Victor AI & Tech autonomous newsroom: collect, cluster, score, draft, approve, publish."
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "rapidfuzz>=3.6",
  "python-dotenv>=1.0",
  "tweepy>=4.14",
  "pillow>=10.0",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["victor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
