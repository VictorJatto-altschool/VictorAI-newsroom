name: telegram

# The always-on newsroom in the cloud. One job runs for up to ~6 hours: a collection cycle every 15 minutes
# and Telegram buttons answered within seconds in between. Before it ends it launches its successor, so the
# chain does not depend on GitHub's cron, which can be hours late on a new repository. The cron is a backup.

on:
  schedule:
    - cron: "5 */5 * * *"
  workflow_dispatch:

concurrency:
  group: telegram-poller
  cancel-in-progress: true

permissions:
  actions: write             # to launch the next job in the chain
  models: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      APP_ENV: ${{ secrets.APP_ENV }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TZ_NAME: Africa/Lagos
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://models.github.ai/inference' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.GITHUB_TOKEN }}
      AI_MODEL: ${{ secrets.AI_MODEL || 'openai/gpt-4o-mini' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - run: pip install ".[postgres]"
      - name: Config check (names and lengths only, never values)
        run: |
          python - <<'PY'
          import os
          for k in ("DATABASE_URL","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID","GROQ_API_KEY","ANTHROPIC_API_KEY"):
              v = os.environ.get(k, "")
              print(f"{k:<20} {'set (' + str(len(v)) + ' chars)' if v.strip() else 'EMPTY'}")
          PY
      - name: Newsroom loop (cycle every 15 min, buttons answered in between)
        run: python -m victor loop --minutes 15 --max-minutes 340

      - name: Launch the next job in the chain
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run telegram.yml --ref main
