name: chain-test
# Proves that a job can launch another workflow run with the built-in token. Safe to delete afterwards.
on:
  workflow_dispatch:
    inputs:
      depth:
        description: "0 launches a child run; 1 just exits"
        default: "0"
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Launch child
        if: inputs.depth == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run chain-test.yml --ref main -f depth=1 --repo "$GITHUB_REPOSITORY"
      - run: echo "depth=${{ inputs.depth }} done"
